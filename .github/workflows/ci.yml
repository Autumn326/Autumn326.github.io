name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate projects.json
        run: python3 scripts/validate_projects.py

      - name: Check media sizes
        run: |
          big=$(find images videos -type f -size +5M 2>/dev/null || true)
          if [ -n "$big" ]; then echo "Files over 5 MB (trim them):"; echo "$big"; exit 1; fi
          echo "Media sizes OK."

      - name: Scan for student IDs
        run: bash scripts/scan_student_ids.sh

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 2 --accept 200,206,429 index.html data/projects.json docs/*.md README.md
          fail: true
